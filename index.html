<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commander Dashboard - RCQ Reporter Style</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
  <style>
    body{background:linear-gradient(135deg,#87CEEB 0%,#B0E0E6 100%);min-height:100vh}
    .navbar-custom{background:white!important;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .navbar-custom .btn-outline-secondary{border:2px solid #000;color:#000;border-radius:25px;font-weight:600;padding:8px 20px;transition:all .3s ease}
    .navbar-custom .btn-outline-secondary:hover{background-color:#87CEEB;border-color:#000;color:#000}
    .navbar-custom .btn-outline-primary{border:2px solid #87CEEB;color:#000;background:white;border-radius:25px;font-weight:600;padding:8px 20px;transition:all .3s ease}
    .navbar-custom .btn-outline-primary:hover,.navbar-custom .btn-outline-primary.router-link-active{background-color:#87CEEB;border-color:#87CEEB;color:#000;transform:translateY(-2px);box-shadow:0 4px 12px rgba(135,206,235,.3)}
    .badge-gold{background-color:#FFD700;color:#000;font-weight:700}.badge-silver{background-color:#C0C0C0;color:#000;font-weight:700}.badge-bronze{background-color:#CD7F32;color:#fff;font-weight:700}.badge-green{background-color:#87CEEB;color:#000;font-weight:700}
    .main-container{background:white;border-radius:16px;padding:2rem;box-shadow:0 4px 16px rgba(0,0,0,.1)}
    .table{border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .table-dark{background-color:#000!important;border-color:#000!important}.table-dark th{color:white;font-weight:700;padding:1rem;border-color:#333!important}
    .table-hover tbody tr:hover{background-color:rgba(135,206,235,.15)}
    .table tbody td{padding:.75rem 1rem;vertical-align:middle}.table tbody td a{color:#0d6efd;font-weight:600;text-decoration:none}.table tbody td a:hover{color:#000;text-decoration:underline}
    .card{border:2px solid #000;border-radius:16px;overflow:hidden;transition:all .3s ease}.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
    .card-title{color:#000;font-weight:700}.meta-stat-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888}.meta-stat-value{font-size:1.1rem;font-weight:800;line-height:1}
    .vde-pill{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:999px}.vde-pill--win{background:#d4edda;color:#1a6630}.vde-pill--loss{background:#f8d7da;color:#842029}.vde-pill--draw{background:#e9ecef;color:#495057}
    .home-container{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#87CEEB 0%,#B0E0E6 100%);padding:2rem}.home-card{background:white!important;border-radius:24px!important;padding:3rem!important;box-shadow:0 8px 32px rgba(0,0,0,.1)!important;max-width:700px;width:100%}
    .home-title{color:#000!important;font-weight:bold!important;text-align:center;margin-bottom:.75rem!important}.home-subtitle{text-align:center;color:#6c757d;margin-bottom:2rem}
    .stores-list{display:flex;flex-direction:column;gap:1rem}.store-group{margin-bottom:1rem}.store-button{display:flex!important;align-items:center!important;gap:1rem!important;padding:10px 20px!important;border:2px solid #000!important;border-radius:50px!important;background:white!important;color:#000!important;font-size:1.1rem!important;font-weight:600!important;text-decoration:none!important;transition:all .3s ease!important;width:fit-content}.store-button:hover{background-color:#87CEEB!important;transform:translateY(-2px)!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important;color:#000!important}
    .store-dates{list-style:none;padding:.25rem 0 0 2rem;margin:0;display:grid;gap:.75rem}.store-dates li{background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:.8rem 1rem}.store-datemeta{color:#6c757d;font-size:.85rem;margin-left:.25rem}
    .summary-kpi{background:linear-gradient(135deg,#f8f9fa 0%,#ffffff 100%);border:2px solid #000;border-radius:18px;padding:1rem;text-align:center;height:100%}.summary-kpi-label{font-size:.75rem;text-transform:uppercase;font-weight:700;color:#6c757d;letter-spacing:.04em}.summary-kpi-value{font-size:1.7rem;font-weight:800;color:#000;line-height:1.1;margin-top:.35rem}
    .page-title{color:#000;font-weight:800;margin-bottom:.25rem}.page-subtitle{color:#6c757d} footer{background:transparent;color:#000;font-weight:600;text-align:center;padding:2rem;margin-top:2rem}
    @media (max-width:768px){.home-card{padding:2rem!important}.main-container{padding:1rem}.store-dates{padding-left:1rem}}
  </style>
</head>
<body>
  <div id="app"></div>
  <footer>Mario Canto · 2026 · Dashboard Commander · Data provided by <a href="https://topdeck.gg" target="_blank" rel="noopener noreferrer">TopDeck.gg</a></footer>
  <script>
    const { createApp, ref, computed, onMounted } = Vue;
    const { createRouter, createWebHashHistory, RouterLink, useRoute } = VueRouter;

    // DESPUÉS
const API_CONFIG = { proxyBase: 'https://edh-proxy-topdeck.mac-maxwell.workers.dev' };

    const store = Vue.reactive({
      events: [{ tid:'clasificatorio-nacional-cedh-vina-del-mar', store:'Todo Freak', storeId:'todo-freak', city:'Viña del Mar', format:'EDH', idLabel:'Clasificatorio Nacional cEDH', fecha:'2026-07-05', eventUrl:'https://topdeck.gg/event/clasificatorio-nacional-cedh-vina-del-mar', social:'https://www.instagram.com/todofreakstore/' }],// DESPUÉS
events: [
  { tid:'clasificatorio-nacional-cedh-vina-del-mar', store:'Todo Freak', storeId:'todo-freak', city:'Viña del Mar', format:'EDH', idLabel:'Clasificatorio Nacional cEDH', fecha:'2026-07-05', eventUrl:'https://topdeck.gg/event/clasificatorio-nacional-cedh-vina-del-mar', social:'https://www.instagram.com/todofreakstore/' },
  { tid:'torneo-commander-landfall-bracket-3-0507', store:'La Posada del Dado', storeId:'la-posada-del-dado', city:'Quillota', format:'EDH', idLabel:'Torneo Commander Landfall Bracket 3', fecha:'2026-07-05', eventUrl:'https://topdeck.gg/bracket/torneo-commander-landfall-bracket-3-0507', social:'https://www.instagram.com/laposadadeldado/' }
],
      tournamentCache: {}, loadingByTid: {}, errorByTid: {}
    });

    function formatDateFriendly(dateString){ if(!dateString) return 'Sin fecha'; return new Date(dateString + 'T00:00:00').toLocaleDateString('es-CL',{year:'numeric',month:'long',day:'numeric'}); }
    function formatUnixDate(unix){ if(!unix) return 'Sin fecha'; return new Date(unix * 1000).toLocaleDateString('es-CL',{year:'numeric',month:'long',day:'numeric'}); }
    function inferBadge(standing){ if(standing===1) return '1st'; if(standing===2) return '2nd'; if(standing<=4) return 'T4'; if(standing<=8) return 'T8'; return null; }
    function badgeClass(badge){ const map={'1st':'badge-gold','2nd':'badge-silver','T4':'badge-bronze','T8':'badge-green'}; return map[badge] || 'text-bg-secondary'; }
    function getCommanders(standing){ const c=standing?.deckObj?.Commanders; if(!c || typeof c!=='object') return []; return Object.keys(c).filter(Boolean); }
    function isHttpUrl(value){ return typeof value === 'string' && /^https?:\/\//.test(value.trim()); }
    function deckPreview(standing){ if(typeof standing?.decklist==='string' && standing.decklist.trim()) return standing.decklist.trim(); const commanders=getCommanders(standing); if(commanders.length) return 'Commanders\n' + commanders.join('\n'); return 'Decklist no disponible'; }

    function buildTournamentSummary(payload){
      const data=payload?.data || {};
      const standings=Array.isArray(payload?.standings)?payload.standings:[];
      const rounds=Array.isArray(payload?.rounds)?payload.rounds:[];
      const normalizedStandings=standings.map(item=>{
        const commanders=getCommanders(item);
        return {
          ...item,
          commanders,
          badge:item.badge || inferBadge(item.standing),
          winRateLabel:item.winRate!==undefined && item.winRate!==null ? `${(Number(item.winRate)*100).toFixed(1)}%` : '—',
          owrLabel:item.opponentWinRate!==undefined && item.opponentWinRate!==null ? `${(Number(item.opponentWinRate)*100).toFixed(1)}%` : '—',
          decklistUrl:isHttpUrl(item.decklist) ? item.decklist.trim() : '',
          commanderLabel:commanders.join(' / ') || 'Sin comandante detectado',
          deckPreview:deckPreview(item)
        };
      }).sort((a,b)=>(a.standing ?? 999)-(b.standing ?? 999));

      const commanderMap={};
      normalizedStandings.forEach(player=>{
        const labels=player.commanders.length?player.commanders:['Sin comandante detectado'];
        labels.forEach(name=>{
          if(!commanderMap[name]) commanderMap[name]={name,count:0,players:[],bestStanding:null,wins:0,losses:0,draws:0,totalGames:0};
          const wins=parseInt(player.wins ?? player.V ?? 0);
          const losses=parseInt(player.losses ?? player.D ?? 0);
          const draws=parseInt(player.draws ?? player.E ?? 0);
          commanderMap[name].count += 1;
          commanderMap[name].players.push(player.name);
          commanderMap[name].wins += wins;
          commanderMap[name].losses += losses;
          commanderMap[name].draws += draws;
          commanderMap[name].totalGames += wins+losses+draws;
          if(player.standing!==undefined && player.standing!==null){
            commanderMap[name].bestStanding = commanderMap[name].bestStanding===null ? player.standing : Math.min(commanderMap[name].bestStanding, player.standing);
          }
        });
      });

      const metagame=Object.values(commanderMap)
        .map(entry=>({ ...entry, share: normalizedStandings.length ? entry.count/normalizedStandings.length : 0, winRate: entry.totalGames ? ((entry.wins/entry.totalGames)*100).toFixed(1) : 'NA' }))
        .sort((a,b)=>b.count-a.count || (a.bestStanding ?? 999)-(b.bestStanding ?? 999));

      return { data, rounds, standings: normalizedStandings, metagame, kpis:{ totalPlayers: normalizedStandings.length, uniqueCommanders: metagame.filter(x=>x.name!=='Sin comandante detectado').length, rounds: rounds.length, topCommander: metagame[0]?.name || '—' } };
    }

    async function loadTournamentData(tid){
      if(store.tournamentCache[tid]) return store.tournamentCache[tid];
      store.loadingByTid[tid]=true;
      store.errorByTid[tid]='';
      try{
        // DESPUÉS
const res=await fetch(`${API_CONFIG.proxyBase}/?tid=${encodeURIComponent(tid)}`);
        const data=await res.json();
        if(!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
        const summary=buildTournamentSummary(data);
        store.tournamentCache[tid]=summary;
        return summary;
      } catch(err){
        store.errorByTid[tid]=err.message || 'No se pudo cargar el torneo';
        throw err;
      } finally {
        store.loadingByTid[tid]=false;
      }
    }

    const Home={
      components:{RouterLink},
      setup(){
        const storeGroups=computed(()=>{
          const map={};
          store.events.forEach(ev=>{ if(!map[ev.storeId]) map[ev.storeId]={id:ev.storeId,label:ev.store,social:ev.social,dates:[]}; map[ev.storeId].dates.push(ev); });
          return Object.values(map).map(group=>({ ...group, dates: group.dates.sort((a,b)=>a.fecha.localeCompare(b.fecha)) }));
        });
        return { storeGroups, formatDateFriendly };
      },
      template:`
        <div class="home-container">
          <div class="home-card">
            <h1 class="home-title">Commander Reporter</h1>
            <p class="home-subtitle">Lista de eventos con la misma línea visual del reporter RCQ y acceso a Standing y Metagame.</p>
            <div v-if="storeGroups.length" class="stores-list">
              <div v-for="s in storeGroups" :key="s.id" class="store-group">
                <a v-if="s.social" :href="s.social" target="_blank" rel="noopener noreferrer" class="store-button store-button--header">
                  <i class="bi bi-instagram"></i><span>{{ s.label }}</span>
                </a>
                <div v-else class="store-button store-button--header"><i class="bi bi-shop"></i><span>{{ s.label }}</span></div>
                <ul class="store-dates">
                  <li v-for="d in s.dates" :key="d.tid">
                    <div>
                      <router-link :to="{ name: 'standing', params: { id: s.id }, query: { tid: d.tid } }">{{ formatDateFriendly(d.fecha) }}</router-link>
                      <span class="store-datemeta">{{ d.store }} · {{ d.format }} · {{ d.idLabel }}</span>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      `
    };

    function useTournamentSummary(){
      const route=useRoute();
      const loading=ref(false);
      const error=ref('');
      const summary=ref(null);
      async function init(){
        if(!route.query.tid) return;
        loading.value=true;
        error.value='';
        try{ summary.value=await loadTournamentData(route.query.tid); }
        catch(err){ error.value=err.message || 'No se pudo cargar el torneo'; }
        finally { loading.value=false; }
      }
      onMounted(init);
      return { route, loading, error, summary };
    }

    const Standing={
      setup(){ return { ...useTournamentSummary(), badgeClass }; },
      template:`
        <div>
          <div v-if="loading" class="text-muted">Cargando standing...</div>
          <div v-else-if="error" class="alert alert-danger">{{ error }}</div>
          <div v-else-if="summary">
            <h2 class="page-title">Standing</h2>
            <p class="page-subtitle">Vista reciclada desde tu reporter original: tabla simple, rápida y legible.</p>
            <div class="table-responsive mt-3">
              <table class="table table-sm table-bordered table-hover align-middle">
                <thead class="table-dark">
                  <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Pts</th>
                    <th>WR</th>
                    <th>OWR</th>
                    <th>Commander</th>
                    <th>Decklist</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="player in summary.standings" :key="player.id || player.name">
                    <td>{{ player.standing ?? '—' }}</td>
                    <td>
                      {{ player.name }}
                      <span v-if="player.badge" class="badge ms-2" :class="badgeClass(player.badge)">{{ player.badge }}</span>
                    </td>
                    <td>{{ player.points ?? '—' }}</td>
                    <td>{{ player.winRateLabel }}</td>
                    <td>{{ player.owrLabel }}</td>
                    <td>{{ player.commanderLabel }}</td>
                    <td>
                      <a v-if="player.decklistUrl" :href="player.decklistUrl" target="_blank" rel="noopener noreferrer">Ver decklist</a>
                      <span v-else class="text-muted small">Embebida / no URL</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `
    };

    const Metagame={
      setup(){ return { ...useTournamentSummary(), formatUnixDate }; },
      template:`
        <div>
          <div v-if="loading" class="text-muted">Cargando metagame...</div>
          <div v-else-if="error" class="alert alert-danger">{{ error }}</div>
          <div v-else-if="summary">
            <h2 class="page-title">Metagame</h2>
            <p class="page-subtitle">Resumen del torneo alineado al estilo del RCQ reporter.</p>
            <div class="row g-3 mb-4 mt-1">
              <div class="col-6 col-md-3"><div class="summary-kpi"><div class="summary-kpi-label">Jugadores</div><div class="summary-kpi-value">{{ summary.kpis.totalPlayers }}</div></div></div>
              <div class="col-6 col-md-3"><div class="summary-kpi"><div class="summary-kpi-label">Commanders</div><div class="summary-kpi-value">{{ summary.kpis.uniqueCommanders }}</div></div></div>
              <div class="col-6 col-md-3"><div class="summary-kpi"><div class="summary-kpi-label">Rondas</div><div class="summary-kpi-value">{{ summary.kpis.rounds }}</div></div></div>
              <div class="col-6 col-md-3"><div class="summary-kpi"><div class="summary-kpi-label">Fecha</div><div class="summary-kpi-value" style="font-size:1rem">{{ formatUnixDate(summary.data.startDate) }}</div></div></div>
            </div>
            <div class="row row-cols-2 row-cols-md-4 g-2">
              <div class="col" v-for="arch in summary.metagame" :key="arch.name">
                <div class="card h-100">
                  <div class="card-body p-2">
                    <div class="d-flex align-items-start gap-1 mb-2">
                      <div class="d-flex flex-wrap gap-1 flex-shrink-0">
                        <span v-if="arch.bestStanding && arch.bestStanding === 1" class="badge badge-gold">1st</span>
                        <span v-else-if="arch.bestStanding && arch.bestStanding === 2" class="badge badge-silver">2nd</span>
                        <span v-else-if="arch.bestStanding && arch.bestStanding <= 4" class="badge badge-bronze">T4</span>
                        <span v-else-if="arch.bestStanding && arch.bestStanding <= 8" class="badge badge-green">T8</span>
                      </div>
                      <h6 class="card-title mb-0" style="font-size:0.82rem;line-height:1.2">{{ arch.name }}</h6>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                      <div class="text-center flex-fill">
                        <div class="meta-stat-label">META</div>
                        <div class="meta-stat-value">{{ (arch.share * 100).toFixed(1) }}%</div>
                      </div>
                      <div class="vr"></div>
                      <div class="text-center flex-fill">
                        <div class="meta-stat-label">WIN</div>
                        <div class="meta-stat-value" :class="arch.winRate !== 'NA' && parseFloat(arch.winRate) >= 52 ? 'wr--green' : (arch.winRate !== 'NA' && parseFloat(arch.winRate) >= 41 ? 'wr--yellow' : 'wr--red')">{{ arch.winRate }}</div>
                      </div>
                    </div>
                    <div class="d-flex justify-content-center gap-2">
                      <span class="vde-pill vde-pill--win">{{ arch.wins }} V</span>
                      <span class="vde-pill vde-pill--loss">{{ arch.losses }} D</span>
                      <span class="vde-pill vde-pill--draw">{{ arch.draws }} E</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };

    const TournamentLayout={
      components:{RouterLink},
      setup(){
        const route=useRoute();
        const selectedEvent=computed(()=>store.events.find(ev=>ev.tid===route.query.tid) || null);
        return { route, selectedEvent, formatDateFriendly };
      },
      template:`
        <div>
          <div class="d-flex align-items-center gap-3 px-3 py-3 border-bottom" style="background: linear-gradient(135deg, #1a3a5c 0%, #1e5080 100%);">
            <div v-if="selectedEvent">
              <div class="text-white fw-bold" style="font-size: 1.8rem; line-height: 1.1;">{{ selectedEvent.store }}</div>
              <div class="mt-1 d-flex flex-wrap gap-2 align-items-center">
                <span class="badge bg-secondary" style="font-size: 0.75rem; background: #87CEEB !important; color: #000;">{{ selectedEvent.format }}</span>
                <span v-if="selectedEvent.idLabel" class="badge bg-warning text-dark" style="font-size: 0.75rem;">{{ selectedEvent.idLabel }}</span>
                <span v-if="selectedEvent.fecha" class="text-white-50" style="font-size: 0.8rem;">{{ formatDateFriendly(selectedEvent.fecha) }}</span>
              </div>
            </div>
          </div>
          <nav class="navbar-custom border-bottom bg-light">
            <div class="container d-flex flex-wrap align-items-center justify-content-between py-2 gap-2">
              <div class="d-flex align-items-center mb-2 mb-md-0 gap-2 flex-wrap">
                <router-link class="btn btn-outline-secondary btn-sm" to="/"><i class="bi bi-arrow-left"></i> Inicio</router-link>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <router-link class="btn btn-sm btn-outline-primary" :to="{ name: 'standing', params: { id: route.params.id }, query: { tid: route.query.tid } }"><i class="bi bi-trophy me-1"></i>Standing</router-link>
                <router-link class="btn btn-sm btn-outline-primary" :to="{ name: 'metagame', params: { id: route.params.id }, query: { tid: route.query.tid } }"><i class="bi bi-pie-chart me-1"></i>Metagame</router-link>
              </div>
            </div>
          </nav>
          <div class="main-container container mt-3">
            <router-view></router-view>
          </div>
        </div>
      `
    };

    const routes=[
      { path:'/', component:Home, name:'home' },
      { path:'/tienda/:id', component:TournamentLayout, children:[
        { path:'standing', component:Standing, name:'standing' },
        { path:'metagame', component:Metagame, name:'metagame' },
        { path:'', redirect: to => ({ name:'standing', params:to.params, query:to.query }) }
      ] }
    ];

    const router=createRouter({ history:createWebHashHistory(), routes });
    createApp({ template:'<router-view></router-view>' }).use(router).mount('#app');
  </script>
</body>
</html>
